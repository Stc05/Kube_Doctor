apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
spec:
  project: default

  sources:
    # 1. Le chart de la communauté Prometheus, à une version figée
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 92.14.0
      helm:
        releaseName: monitoring
        valueFiles:
          - $values/helm/monitoring-values.yaml
    # 2. Mon dépôt, d'où viennent mes réglages
    - repoURL: https://github.com/Stc05/Kube_Doctor.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
