apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: autoscaling
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Stc05/Kube_Doctor.git
    targetRevision: main
    path: k8s/autoscaling
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
